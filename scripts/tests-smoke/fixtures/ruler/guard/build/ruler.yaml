kind: ruler
spec: spec.yaml
deps: {manifest: none, install_cmd: "none"}
acs:
  - ac: AC-1
    status: ruled
    interface: ["src/x.py::def f()"]
    nodes:
      - {test: "build/ruler/test_x.py::test_ac_1", check_command: "python3 scripts/ruler.py run --ruler build/ruler.yaml build/ruler/test_x.py::test_ac_1"}

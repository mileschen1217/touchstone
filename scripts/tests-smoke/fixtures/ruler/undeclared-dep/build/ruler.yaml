kind: ruler
spec: spec.yaml
deps: {manifest: requirements.txt, install_cmd: "python3 -m pip install -q --disable-pip-version-check -r requirements.txt"}
acs:
  - ac: AC-1
    status: ruled
    interface: ["src/greet.py::def main()"]
    nodes:
      - {test: "build/ruler/test_greet.py::test_ac_1", check_command: "python3 scripts/ruler.py run --ruler build/ruler.yaml build/ruler/test_greet.py::test_ac_1"}
  - ac: AC-2
    status: ruled
    interface: ["src/greet.py::def main()"]
    nodes:
      - {test: "build/ruler/test_greet.py::test_ac_2", check_command: "python3 scripts/ruler.py run --ruler build/ruler.yaml build/ruler/test_greet.py::test_ac_2"}

kind: ruler
spec: spec.yaml
deps: {manifest: none, install_cmd: "none"}
acs:
  - ac: AC-1
    status: ruled
    interface: ["src/greet.py::def main()"]
    nodes:
      - {test: "build/ruler/test_greet.py::test_ac_1", check_command: "python3 scripts/ruler.py run --ruler build/ruler.yaml build/ruler/test_greet.py::test_ac_1"}
      - {test: "build/ruler/test_greet.py::test_ac_1_wrong", check_command: "python3 scripts/ruler.py run --ruler build/ruler.yaml build/ruler/test_greet.py::test_ac_1_wrong"}
      - {test: "build/ruler/test_silent.sh::test_ac_1_silent", check_command: "python3 scripts/ruler.py run --ruler build/ruler.yaml build/ruler/test_silent.sh::test_ac_1_silent"}

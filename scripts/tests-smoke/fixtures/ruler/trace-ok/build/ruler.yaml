kind: ruler
spec: spec.yaml
deps: {manifest: none, install_cmd: "none"}
acs:
  - ac: AC-1
    status: ruled
    interface: ["src/greet.py::def main()"]
    nodes:
      - {test: "build/ruler/test_greet.py::test_ac_1", check_command: "python3 scripts/ruler.py run --ruler build/ruler.yaml build/ruler/test_greet.py::test_ac_1"}
  - ac: AC-2
    status: ruled
    interface: ["src/tool.sh::main()"]
    nodes:
      - {test: "build/ruler/test_tool.sh::test_ac_2", check_command: "python3 scripts/ruler.py run --ruler build/ruler.yaml build/ruler/test_tool.sh::test_ac_2"}
  - ac: AC-3
    status: ruled
    interface: ["scripts/target.sh::main()"]
    nodes:
      - {test: "smoke::target says ok", check_command: "python3 scripts/ruler.py run --ruler build/ruler.yaml smoke::target says ok"}

# deviation.schema.yaml — build-time deviations (D-n). The quiz block moved out to its own
# quiz.yaml / quiz.schema.yaml (phase 5) — this file no longer accepts a `quiz` key.
# Keywords as in spec.schema.yaml. Waiting item shape is homed in spec.schema.yaml's header.
# `resolves: phase` — an entry's `refs` resolves against the `*.spec.yaml` under --root whose
# top-level `phase` equals that entry's own `phase` — see spec.schema.yaml's header for the
# spec_ref keyword.
# Entry fields the builder fills by judgment beside gap/disposition: `panel` = the
# phase_map panel the gap belongs to (none when it belongs to no human panel);
# `which_stage_could_have_caught` = the earliest stage whose gate should have caught it;
# `catcher` = who actually found it (builder / reviewer / owner, with the instrument).
# An entry's `refs` may be empty only beside `derived: true`.
kind: deviation
resolves: phase
type: object
additionalProperties: false
required: [entries, waiting_on_human]
properties:
  entries:
    type: array
    reader: human
    items:
      type: object
      required: [id, phase, date, stage, panel, gap, which_stage_could_have_caught, catcher, disposition, refs]
      additionalProperties: false
      properties:
        id: {type: string, id: D}
        phase: {type: integer}
        date: {type: date}
        stage: {type: string}
        panel: {type: string, enum: [position, structure, interface, scope, none]}
        gap:
          type: object
          required: [title, detail]
          additionalProperties: false
          properties:
            title: {type: string}
            detail: {type: string}
        which_stage_could_have_caught: {type: string}
        catcher: {type: string}
        disposition:
          type: object
          required: [title, detail]
          additionalProperties: false
          properties:
            title: {type: string}
            detail: {type: string}
        refs:
          type: array
          items:
            type: string
            pattern: '^(US|REQ|AC|INV)-\d+$'
            spec_ref: true
        derived: {type: boolean}
  waiting_on_human:
    type: array
    reader: human
    items:
      type: object
      required: [id, kind, owner, title]
      additionalProperties: false
      properties:
        id: {type: string, id: W}
        kind: {type: string, enum: [ruling, answer, accept, fix]}
        owner: {type: string}
        title: {type: string}
        detail: {type: string}
        refs:
          type: array
          items:
            type: string
            pattern: '^(US|REQ|AC|INV)-\d+$'
            spec_ref: true

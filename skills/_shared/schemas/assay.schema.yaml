# assay.schema.yaml — the structured interview record (assay-<date>-<subject>.yaml),
# replacing the seven-section markdown record. Keywords as in spec.schema.yaml's header.
# `resolves: none` — this kind carries no `spec_ref` field (it is not itself a resolution
# target for US/REQ/AC/INV ids; a spec's `facts_source.record` pointing at a `.yaml` record
# of this shape is resolved by a structured lookup across term_sheet/alignment/extraction
# ids, in check-artifact.sh's ledger-resolution step — read-compatible with the legacy `.md`
# record's line-prefix rule). Id families T (term_sheet), A/B (alignment — map-arm rows are
# `A-n`, bold-pass rows are `B-n`, one shared list), Q/R (extraction — rulings `Q-n`, dated
# predict/probe rounds `R-n`) are preserved so a spec's `facts_source.consensus` refs keep
# resolving structurally. `rulings[]` on an extraction or alignment item is the design-review write-back
# target (date/stage/text, appended — never a markdown line form).
#
# Consumers, per top-level field:
#   subject, date, epics — skills/assay/SKILL.md (record frontmatter equivalent, producer);
#                           scripts/dossier-render.sh (card header)
#   term_sheet           — skills/assay/SKILL.md (vocabulary arm); scripts/check-artifact.sh
#                           (ledger structured lookup); scripts/dossier-render.sh (ledger
#                           anchors)
#   alignment             — skills/assay/SKILL.md (map arm + bold pass); check-artifact.sh
#                           (ledger structured lookup); dossier-render.sh (ledger anchors)
#   extraction            — skills/assay/SKILL.md (extraction Q&A arm);
#                           skills/design-review/SKILL.md (ruling write-back target);
#                           check-artifact.sh (ledger structured lookup); dossier-render.sh
#                           (ledger anchors + 建置帳 stage-filtered fold of rulings)
#   consensus             — skills/assay/SKILL.md (the terminal deliverable the contract
#                           author consumes); skills/design-spec/SKILL.md
#                           (facts_source.consensus refs resolve into these rows);
#                           check-artifact.sh (structured lookup); dossier-render.sh (ledger
#                           anchors)
#   flip_triggers         — skills/assay/SKILL.md (flip-trigger registry); dossier-render.sh
#                           (card)
#   deferred              — skills/assay/SKILL.md (deferred log); dossier-render.sh (card)
#   readiness             — skills/assay/SKILL.md (readiness ruling); skills/crucible/SKILL.md
#                           (gate: crucible does not advance until this ruling exists);
#                           dossier-render.sh (card)
kind: assay
resolves: none
type: object
additionalProperties: false
required: [subject, date, epics, term_sheet, alignment, extraction, consensus, flip_triggers, deferred, readiness]
properties:
  subject: {type: string, reader: agent}
  date: {type: date, reader: agent}
  epics: {type: array, items: {type: string}, reader: agent}
  term_sheet:
    type: array
    reader: human
    items:
      type: object
      required: [id, term, definition, source]
      additionalProperties: false
      properties:
        id: {type: string, id: T, pattern: '^T-\d+$'}
        term: {type: string}
        definition: {type: string}
        source: {type: string, enum: [doc-grounded, session-coined-ai, session-coined-human, ledger-conflict]}
  alignment:
    type: array
    reader: human
    items:
      type: object
      required: [id, tags, leaning]
      additionalProperties: false
      properties:
        id: {type: string, id: A, pattern: '^[AB]-\d+$'}
        tags: {type: array, items: {type: string}}
        leaning: {type: string}
        planned_handling: {type: string}
        rulings:
          type: array
          items:
            type: object
            required: [date, stage, text]
            additionalProperties: false
            properties:
              date: {type: date}
              stage: {type: string}
              text: {type: string}
  extraction:
    type: array
    reader: human
    items:
      type: object
      required: [id, text]
      additionalProperties: false
      properties:
        id: {type: string, id: Q, pattern: '^[QR]-\d+$'}
        text: {type: string}
        rulings:
          type: array
          items:
            type: object
            required: [date, stage, text]
            additionalProperties: false
            properties:
              date: {type: date}
              stage: {type: string}
              text: {type: string}
  consensus:
    type: object
    reader: agent
    required: [scope, invariants, contract_facts, out_of_scope]
    additionalProperties: false
    properties:
      scope:
        type: array
        items:
          type: object
          required: [text, trace]
          additionalProperties: false
          properties:
            text: {type: string}
            trace: {type: array, items: {type: string}}
      invariants:
        type: array
        items:
          type: object
          required: [text, trace]
          additionalProperties: false
          properties:
            text: {type: string}
            trace: {type: array, items: {type: string}}
      contract_facts:
        type: array
        items:
          type: object
          required: [text, trace]
          additionalProperties: false
          properties:
            text: {type: string}
            trace: {type: array, items: {type: string}}
      out_of_scope:
        type: array
        items:
          type: object
          required: [text, trace]
          additionalProperties: false
          properties:
            text: {type: string}
            trace: {type: array, items: {type: string}}
  flip_triggers:
    type: array
    reader: human
    items:
      type: object
      required: [signal, revisit]
      additionalProperties: false
      properties:
        signal: {type: string}
        revisit: {type: string}
  deferred: {type: array, reader: human, items: {type: string}}
  readiness:
    type: object
    reader: agent
    required: [yes, date, round]
    additionalProperties: false
    properties:
      yes: {type: boolean}
      date: {type: date}
      round: {type: string, pattern: '^R-\d+$'}

# This schema defines the per-epic understanding quiz, the Post-build pair's quiz half (the
# explainer is the other half). Keywords as in the keyword legend (spec schema header).
# `resolves: phase` — an item's `refs` resolve against the phase-matched design spec under
# --root whose top-level `phase` equals that item's own `phase` (see the keyword legend
# (spec schema header) for the spec_ref keyword and the resolution rule). `anchor` is a
# field path per the field-path grammar. Retired legacy keys (asserted dead by a red
# fixture): `kind`, `expected_refs`, `answer_refs`.
kind: quiz
resolves: phase
type: object
additionalProperties: false
required: [waived, items]
properties:
  waived: {type: boolean, reader: human}
  phase_summaries:
    type: array
    reader: human
    items:
      type: object
      required: [phase, text]
      additionalProperties: false
      properties:
        phase: {type: integer}
        text: {type: string}
  items:
    type: array
    reader: human
    items:
      type: object
      required: [id, phase, question, refs, anchor]
      additionalProperties: false
      properties:
        id: {type: string, id: QZ}
        phase: {type: integer}
        question: {type: string}
        answer: {type: string}
        refs:
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^(US|REQ|AC|INV)-\d+$'
            spec_ref: true
        anchor: {type: string, field_path: true}
        result: {type: string, enum: [pass, miss]}

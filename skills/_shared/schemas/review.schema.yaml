# This schema defines the single output of a review gate, one file per round.
# Keywords as in the keyword legend (spec schema header); `field_path: true` = a locator per
# the field-path grammar (`<top>[<sel>].<key>…`, sel = stable id | 0-based index | `*`),
# resolved in the target spec when --root is given. `challenger` names the provider that ran
# the challenger context (design-review rounds); its presence in the round-1 file is the
# challenge attestation. Waiting item shape is homed in the keyword legend (spec schema
# header).
# `coverage[]` holds the conformance lens's covered AC or INV rows; findings[] holds only
# unverified or violated rows for that lens.
kind: review
resolves: target
type: object
additionalProperties: false
required: [gate, target, sha, round, providers, degraded, verdict, counts, findings, rulings, waiting_on_human]
properties:
  gate: {type: string, reader: agent, enum: [design-review, deliverable-review, plugin-review]}
  target: {type: string, reader: agent}      # the governing spec file (relative to --root); field paths and rulings resolve through it
  range: {type: string, reader: agent}       # deliverable-review: the reviewed commit range
  sha: {type: string, reader: agent}
  round: {type: integer, reader: agent}
  providers:
    type: array
    reader: agent
    minItems: 1
    items:
      type: object
      required: [lens, arms]
      additionalProperties: false
      properties:
        lens: {type: string}
        arms:
          type: array
          minItems: 1
          items: {type: string, enum: [cc, codex]}
        # fragments_read — the fragment ids the arm reported reading (its report's
        # opening `fragments_read: <ids>` line); absent only on a degraded round
        # (check-artifact.sh cross-field rule, not pure schema — a review.yaml carries no
        # manifest to check the ids against). An empty list is rejected by the same rule:
        # an arm that read nothing is the degraded case, not an empty list.
        fragments_read:
          type: array
          items: {type: string}
  challenger: {type: string, reader: agent, enum: [cc, codex]}
  degraded: {type: boolean, reader: human}
  # degraded_reason — one or more `; `-joined segments, each a literal shape the pattern
  # admits (fill <name> / <n> / <detail> / <vendor> per the matched alternative; the lens
  # prefix is optional for a standalone producer, except the read-back class below, whose
  # whole point is naming the lens); free-form prose is rejected. The read-back class:
  # `lens <name>: read-back missing` (no fragment ids reported) and
  # `lens <name>: read-back incomplete — missing <space-separated ids>` (a proper subset
  # reported) — the class where an arm ran but could not prove it read its lens.
  degraded_reason: {type: string, reader: human, pattern: '((lens [A-Za-z0-9_-]+: )?(codex unavailable|codex timeout \(\d+s\)|codex error: .+|partial(: .+)?|all arms failed|independence lost — .+)|vendor rule waived by `with (cc|codex)`|lens [A-Za-z0-9_-]+: read-back (missing|incomplete — missing [A-Za-z0-9_-]+(?: [A-Za-z0-9_-]+)*))(; ((lens [A-Za-z0-9_-]+: )?(codex unavailable|codex timeout \(\d+s\)|codex error: .+|partial(: .+)?|all arms failed|independence lost — .+)|vendor rule waived by `with (cc|codex)`|lens [A-Za-z0-9_-]+: read-back (missing|incomplete — missing [A-Za-z0-9_-]+(?: [A-Za-z0-9_-]+)*)))*'}
  verdict: {type: string, reader: human, enum: [approve, revise, block]}
  counts:
    type: object
    reader: human
    required: [C, H, M, L]
    additionalProperties: false
    properties:
      C: {type: integer}
      H: {type: integer}
      M: {type: integer}
      L: {type: integer}
  rulings: {type: array, reader: agent, items: {type: string}, ledger_ref: true}
  coverage:
    type: array
    reader: agent
    items:
      type: object
      required: [ref, status, evidence]
      additionalProperties: false
      properties:
        ref:
          type: string
          pattern: '^(AC|INV)-\d+$'
          spec_ref: true
        status: {type: string, enum: [covered]}
        evidence: {type: string}
  findings:
    type: array
    reader: agent
    items:
      type: object
      required: [id, lens, type, provenance, severity, summary, fix, status, found_by]
      additionalProperties: false
      properties:
        id: {type: string, id: F}
        lens: {type: string}
        type: {type: string, enum: [coverage-gap, real-defect, refinement, soundness]}
        provenance: {type: string, enum: [original, fix-induced]}
        severity: {type: string, enum: [C, H, M, L]}
        field: {type: string, field_path: true}
        file: {type: string}
        line: {type: integer}
        summary: {type: string}
        fix: {type: string}
        status: {type: string, enum: [open, fixed, waived, unverified]}
        found_by:
          type: array
          minItems: 1
          items: {type: string, enum: [cc, codex]}
        refs:
          type: array
          items:
            type: string
            pattern: '^(US|REQ|AC|INV)-\d+$'
            spec_ref: true
  waiting_on_human:
    type: array
    reader: human
    items:
      type: object
      required: [id, kind, owner, title]
      additionalProperties: false
      properties:
        id: {type: string, id: W}
        kind: {type: string, enum: [ruling, answer, accept, fix]}
        owner: {type: string}
        title: {type: string}
        detail: {type: string}
        refs:
          type: array
          items:
            type: string
            pattern: '^(US|REQ|AC|INV)-\d+$'
            spec_ref: true

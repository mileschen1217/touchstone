# lens-manifest.yaml — the single declaration of which prose sections compose each
# review lens and which side of a dispatch each section lands on.
#
# Read by `scripts/assemble-arm-task.sh` in a subprocess and by `scripts/plugin-map.sh`
# at measurement time — never by a gate session, so its own bytes are charged to no
# context. A gate body declares WHICH lenses go to WHICH arms; this file declares what
# text each lens carries.
#
# name        — the lens name, unique across the file; the same name a gate body's
#               `lenses:` block uses.
# arms        — the default arm set; a caller may add an arm, never remove the last one.
# subject     — always true: every lens takes a subject, so the assembler's output shape
#               is unconditional.
# sections[].ref
#             — repo-relative path, optionally `#<heading>` (the heading's text without
#               its leading `#`s). No heading means the whole file.
# sections[].id
#             — the fragment id; the arm opens its report with `fragments_read: <ids>`.
# sections[].destination
#             — `arm`: assembled into the dispatched arm's lens file and charged to that
#               arm's context, never to a session's.
#               `host`: the dispatching session reads it itself; it is excluded from every
#               assembled lens file and stays charged to that session.

lenses:
  # ---------------------------------------------------------------- design-review
  - name: challenger
    arms: [cc]
    subject: true
    sections:
      - {ref: skills/_shared/inject/severity-qualification.md, id: sev-qual, destination: arm}

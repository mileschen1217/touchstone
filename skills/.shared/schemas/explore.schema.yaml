# This schema defines the exploration deliverable: a saturated seam-map, the channels
# swept, and the plateau call. Keywords as in the keyword legend (spec schema header).
# `resolves: none` — this kind carries no `spec_ref` field; it is consumed as a
# verify-against baseline, never itself resolved against. The channel and plateau
# vocabulary is homed in the reach-discovery and sweep-method references — this schema is
# the on-disk shape of their output, not a restatement of the method.
kind: explore
resolves: none
type: object
additionalProperties: false
required: [subject, date, intent, seam_maps, channels, plateau]
properties:
  subject: {type: string, reader: agent}
  date: {type: date, reader: agent}
  intent: {type: string, reader: human}
  seam_maps:
    type: array
    reader: agent
    items:
      type: object
      required: [artifact, parties]
      additionalProperties: false
      properties:
        artifact: {type: string}
        parties:
          type: array
          items:
            type: object
            required: [party, ref]
            additionalProperties: false
            properties:
              party: {type: string}
              ref: {type: string}
  channels:
    type: array
    reader: agent
    items:
      type: object
      required: [name, new_parties]
      additionalProperties: false
      properties:
        name: {type: string}
        new_parties: {type: integer}
  plateau: {type: boolean, reader: agent}
  reach_under_determined: {type: string, reader: human}
